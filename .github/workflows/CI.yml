name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the source code of the project
      - name: Checkout
        uses: actions/checkout@v4
      # Setup the jdk using version 11 of Adoptium Temurin
      - name: Setup java 11 using Adoptium Temurin
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Prepare Host
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          # On GHA (Ubuntu 24.04), unprivileged userns are restricted by AppArmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # 1. Set up Docker Buildx (required for advanced caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Build the image using GHA Cache
      # This will build the image and "load" it into the local Docker daemon
      - name: Build and cache Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nm-unittest-services
          file: ./nm-unittest-services/Dockerfile
          tags: nm-unittest-services:latest
          outputs: type=docker,dest=/tmp/image.tar # Build and export to tar
          # The secret sauce:
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Load the image into the Docker daemon
      - name: Load image
        run: |
          docker load --input /tmp/image.tar

      # 4. Start Compose
      - name: Start Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d
        working-directory: nm-unittest-services
      - name: Run tests
        run: bash nm-unittest-services/run_ssh_test.sh
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: noisemodelling_db
          POSTGRES_USER: noisemodelling
          POSTGRES_PASSWORD: noisemodelling
      - name: Package
        run: mvn package
      - name: Install bsdtar
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Unzip production artifacts
        run: |
          mkdir NoiseModellingCovadis
          # bsdtar handles .zip and supports --strip-components
          bsdtar -xvf covadis-webserver/target/*.zip --strip-components=1 -C NoiseModellingCovadis
      - name: Generate Sanitized Artifact Name
        id: sanitize
        run: |
          # Determine the raw value (Ref name if not default branch, otherwise SHA)
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
          RAW_VAL="${{ github.ref_name }}"
          else
          RAW_VAL="${{ github.sha }}"
          fi
  
          # Use sed to perform replacements:
          # 1. / and \ become _
          # 2. : is removed
          # 3. * becomes x
          CLEAN_VAL=$(echo "$RAW_VAL" | sed 's/[\/\\]/_/g; s/://g; s/\*/x/g')
          
          # Set it as an environment variable for the next step
          echo "ARTIFACT_NAME=NoiseModellingCovadis-$CLEAN_VAL" >> $GITHUB_ENV
      - name: Upload distribution file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: NoiseModellingCovadis/



